<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CraftProof - لوحة التحكم</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#0a0a14;color:#e0e0ff;min-height:100vh;padding:20px;background-image:radial-gradient(circle at 20% 20%,rgba(120,0,255,0.15),transparent 50%),radial-gradient(circle at 80% 80%,rgba(0,255,200,0.1),transparent 50%)}
.container{max-width:900px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin:20px 0}
h1{font-size:1.5rem;background:linear-gradient(90deg,#00ffc8,#a855f7,#ff0080);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:900}
a{color:#00ffc8;text-decoration:none;font-size:.85rem;border:1px solid #333355;padding:8px 14px;border-radius:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.stat{background:rgba(20,20,35,.8);border:1px solid rgba(120,0,255,.3);border-radius:14px;padding:20px;text-align:center}
.stat .n{font-size:2rem;font-weight:900;background:linear-gradient(90deg,#00ffc8,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat .l{font-size:.75rem;color:#8888aa;margin-top:6px}
.status{background:rgba(20,20,35,.8);border:1px solid rgba(120,0,255,.3);border-radius:14px;padding:16px;margin-bottom:20px;text-align:center}
.status .v{font-size:1.1rem;font-weight:700;margin-top:6px}
.ok{color:#00ffc8}
.bad{color:#ff0080}
.card{background:rgba(20,20,35,.8);border:1px solid rgba(120,0,255,.3);border-radius:14px;padding:20px}
.card h2{font-size:.95rem;color:#00ffc8;margin-bottom:12px}
.row{display:flex;justify-content:space-between;font-size:.8rem;color:#8888aa;padding:8px 0;border-bottom:1px solid #222244}
.row:last-child{border:none}
.row .v{color:#e0e0ff;font-family:monospace;font-size:.75rem}
</style>
</head>
<body>
<div class="container">
<div class="top">
<h1>لوحة التحكم</h1>
<a href="/">رجوع</a>
</div>
<div class="stats">
<div class="stat"><div class="n" id="total">0</div><div class="l">إجمالي البصمات</div></div>
<div class="stat"><div class="n" id="users">0</div><div class="l">مستقلون موثقون</div></div>
</div>
<div class="status">
<div class="l" style="font-size:.75rem;color:#8888aa">حالة السجل</div>
<div class="v" id="integrity">جاري الفحص...</div>
</div>
<div class="card">
<h2>معلومات النظام</h2>
<div class="row"><span>أول توقيع</span><span class="v" id="first">-</span></div>
<div class="row"><span>آخر توقيع</span><span class="v" id="last">-</span></div>
<div class="row"><span>إصدار</span><span class="v">CraftProof V2</span></div>
</div>
</div>
<script>
fetch('/api/stats').then(function(r){return r.json()}).then(function(d){
  document.getElementById('total').textContent=d.total;
  document.getElementById('users').textContent=d.users;
  var ig=document.getElementById('integrity');
  if(d.integrity){ig.textContent='سليم - لا تلاعب';ig.className='v ok'}
  else{ig.textContent='تحذير - السجل معدل';ig.className='v bad'}
  document.getElementById('first').textContent=d.firstAt?new Date(d.firstAt).toLocaleString('ar'):'-';
  document.getElementById('last').textContent=d.lastAt?new Date(d.lastAt).toLocaleString('ar'):'-';
}).catch(function(){document.getElementById('integrity').textContent='خطأ في التحميل'});
</script>
</body>
</html>
